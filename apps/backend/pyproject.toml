[project]
name = "advx-backend"
version = "0.1.0"
description = "Local FastAPI backend for ADVX Live"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.2,<2",
    "silero-vad>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advx_backend"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
