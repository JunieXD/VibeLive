<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">AI Audience 众声</title>
  <desc id="desc">ADVX Live turns a shared screen, voice, and text into distinct reactions from a local AI audience.</desc>

  <rect width="1200" height="420" rx="24" fill="#0b0d10"/>

  <g opacity="0.38" stroke="#343941" stroke-width="1">
    <path d="M48 78H668"/>
    <path d="M48 342H668"/>
    <path d="M688 48V372"/>
  </g>

  <g transform="translate(52 48)">
    <text x="0" y="22"
          fill="#98a2ad"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" font-weight="600">ADVX LIVE · LOCAL AI AUDIENCE</text>

    <text x="0" y="106"
          fill="#f6f2e9"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="64" font-weight="760">AI Audience</text>
    <text x="0" y="166"
          fill="#57d6c7"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="54" font-weight="760">众声</text>

    <text x="0" y="218"
          fill="#f6c85f"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="28" font-weight="650">同一幕，众声不同。</text>

    <text x="0" y="262"
          fill="#c9d0d7"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="20">让画面、语音与文字，变成一群有身份、会接话、</text>
    <text x="0" y="294"
          fill="#c9d0d7"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
          font-size="20">有不同观点的 AI 观众实时弹幕。</text>

    <g transform="translate(0 326)">
      <rect x="0" y="0" width="132" height="34" rx="17" fill="#182b29" stroke="#2f746d"/>
      <text x="66" y="23" text-anchor="middle"
            fill="#77e1d5"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18">SCREEN</text>
      <rect x="144" y="0" width="116" height="34" rx="17" fill="#2c2415" stroke="#80662c"/>
      <text x="202" y="23" text-anchor="middle"
            fill="#f6c85f"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18">VOICE</text>
      <rect x="272" y="0" width="100" height="34" rx="17" fill="#30201f" stroke="#8f4540"/>
      <text x="322" y="23" text-anchor="middle"
            fill="#ff7d72"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18">TEXT</text>
    </g>
  </g>

  <g transform="translate(724 48)">
    <rect width="428" height="324" rx="20" fill="#14171c" stroke="#343a43" stroke-width="2"/>

    <circle cx="24" cy="24" r="5" fill="#ff6b5e"/>
    <circle cx="42" cy="24" r="5" fill="#f6c85f"/>
    <circle cx="60" cy="24" r="5" fill="#57d6c7"/>
    <text x="82" y="31"
