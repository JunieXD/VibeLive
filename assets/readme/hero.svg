    <g transform="translate(28 74)">
      <rect width="182" height="132" rx="12" fill="#0b0d10" stroke="#59616c" stroke-width="2"/>
      <rect x="14" y="16" width="154" height="82" rx="7" fill="#20252c"/>
      <path d="M30 78L68 48L94 68L120 40L154 78Z" fill="#2e5f5a"/>
      <circle cx="134" cy="36" r="10" fill="#f6c85f"/>
      <path d="M70 116H112" stroke="#98a2ad" stroke-width="4" stroke-linecap="round"/>
      <path d="M91 99V116" stroke="#98a2ad" stroke-width="4" stroke-linecap="round"/>
      <text x="91" y="157" text-anchor="middle"
