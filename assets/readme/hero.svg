      <path d="M210 140C250 140 246 160 272 160"/>
      <path d="M210 168C250 168 246 228 272 228"/>
    </g>

    <g transform="translate(268 68)">
      <circle cx="24" cy="24" r="22" fill="#17312e" stroke="#57d6c7" stroke-width="2"/>
      <text x="24" y="31" text-anchor="middle"
            fill="#77e1d5"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
