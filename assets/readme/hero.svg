      <rect x="58" y="5" width="110" height="38" rx="9" fill="#182b29"/>
      <text x="113" y="30" text-anchor="middle"
            fill="#d4f5f1"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="18">追问细节</text>

      <circle cx="24" cy="92" r="22" fill="#302717" stroke="#f6c85f" stroke-width="2"/>
      <text x="24" y="99" text-anchor="middle"
            fill="#f6c85f"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="20" font-weight="700">感</text>
      <rect x="58" y="73" width="110" height="38" rx="9" fill="#2c2415"/>
      <text x="113" y="98" text-anchor="middle"
            fill="#fff0c5"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="18">回应情绪</text>

      <circle cx="24" cy="160" r="22" fill="#352120" stroke="#ff6b5e" stroke-width="2"/>
      <text x="24" y="167" text-anchor="middle"
            fill="#ff8e84"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
            font-size="20" font-weight="700">拆</text>
      <rect x="58" y="141" width="110" height="38" rx="9" fill="#30201f"/>
      <text x="113" y="166" text-anchor="middle"
            fill="#ffd4d0"
